name: Feature
description: A change in behaviour or a new capability.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who needs it and why.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Expected behaviour; acceptance criteria if known.
    validations:
      required: true
  - type: input
    id: milestone
    attributes:
      label: Milestone
      description: Matching item of docs/08, if any.
