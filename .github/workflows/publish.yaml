name: Publish attested runtime
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-runtime
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Require successful CI for the exact main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          endpoint="repos/$GITHUB_REPOSITORY/actions/workflows/ci.yaml/runs"
          gh api "$endpoint?head_sha=$GITHUB_SHA&status=completed&per_page=10" \
            --jq '.workflow_runs | any(.head_sha == env.GITHUB_SHA and .event == "push" and .conclusion == "success")' \
            | grep -qx true
      - name: Registry name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
