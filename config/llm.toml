# LLM routing for the follow-up service.
#
# Each purpose walks its routes in order and fails over only on
# availability errors (timeouts, 429, 5xx, model not available).
# Different model generations are listed on purpose: an outage of one
# deployment rarely takes down the others.
#
# Prices are USD per 1M tokens. They change: re-check the provider's
# pricing page and update `verified_on` together with the numbers.

daily_budget_usd = "5"
request_timeout_s = 20
breaker_failure_threshold = 5
breaker_cooldown_s = 30

[[routes.interpret_note]]
model = "gpt-6.1-sol"
effort = "low"
verbosity = "low"
max_output_tokens = 2048

[[routes.interpret_note]]
model = "gpt-6-sol"
effort = "low"
verbosity = "low"
max_output_tokens = 2048

[[routes.interpret_note]]
model = "gpt-5.6-sol"
effort = "low"
verbosity = "low"
max_output_tokens = 2048

[[routes.draft_message]]
model = "gpt-6.1-sol"
effort = "low"
verbosity = "low"
max_output_tokens = 2048

[[routes.draft_message]]
model = "gpt-6-sol"
effort = "low"
verbosity = "low"
max_output_tokens = 2048

[[routes.draft_message]]
model = "gpt-5.6-sol"
effort = "low"
verbosity = "low"
max_output_tokens = 2048

# The orchestrator plans one action per new task state in at most four
# steps; it gets more reasoning effort than single-shot purposes.
[[routes.orchestrate]]
model = "gpt-6.1-sol"
effort = "medium"
verbosity = "low"
max_output_tokens = 4096

[[routes.orchestrate]]
model = "gpt-6-sol"
effort = "medium"
verbosity = "low"
max_output_tokens = 4096

[[routes.orchestrate]]
model = "gpt-5.6-sol"
effort = "medium"
verbosity = "low"
max_output_tokens = 4096

[prices."gpt-6.1-sol"]
input_per_mtok = "2"
output_per_mtok = "10"
source = "OpenAI model page gpt-6.1-sol"
verified_on = "2026-10-22"

[prices."gpt-6-sol"]
input_per_mtok = "2"
output_per_mtok = "10"
source = "OpenAI model page gpt-6-sol"
verified_on = "2026-10-22"

[prices."gpt-5.6-sol"]
input_per_mtok = "4"
cached_input_per_mtok = "0.40"
output_per_mtok = "20"
source = "OpenAI model page gpt-5.6-sol (promotional price until 2026-11-21)"
verified_on = "2026-10-22"
