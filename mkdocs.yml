site_name: TechCom AI Operations & Follow-up Service
site_description: Design and engineering documentation
repo_url: https://github.com/Andrey-Sema/Techcom
edit_uri: ""
docs_dir: docs
site_dir: var/site
strict: true
validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy
    - search.highlight
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Overview: index.md
  - Design:
      - "00 — Requirements Analysis": 00-requirements-analysis.md
      - "02 — Architecture": 02-architecture.md
      - "04 — Decision Policy & LLM Contract": 04-decision-policy-and-llm.md
      - "05 — Reliability Design": 05-reliability.md
      - "06 — Test Strategy": 06-test-strategy.md
      - "08 — Scope, Status and Next Steps": 08-implementation-plan.md
      - "09 — Operating at 10,000 Tasks/Day": 09-operations-at-scale.md
      - "14 — Logging & Observability (ASVS V16, OWASP Logging Cheat Sheet)": 14-logging-and-observability.md
      - "15 — Security Baseline: OWASP ASVS 5.0 Level 2 + OWASP Cheat Sheets": 15-security-asvs-l2.md
      - "18 — Operations Runbook": 18-runbook.md
      - "19 — API and Deployment": 19-api-and-deployment.md
  - "Benchmarks": benchmarks.md
  - Security evidence:
      - "ASVS 5.0 traceability (generated)": asvs-traceability.md
      - "Docker Security checklist": security/docker-security.md
      - "LLM Prompt Injection checklist": security/llm-prompt-injection.md
      - "OWASP LLM Top 10 matrix": security/owasp-llm-top10.md
      - "FastAPI checklist": security/fastapi-security.md
      - "Logging checklist": security/logging-security.md
  - Evaluation evidence:
      - "Current synthetic replay": eval/interp.v1-draft.v2-hardening.v2.md
  - Decisions (ADR):
      - "ADR-0001: Hexagonal architecture with a functional core": adr/0001-hexagonal-functional-core.md
      - "ADR-0002: PostgreSQL 18 for state and outbox; no Redis/Celery": adr/0002-postgresql-18-no-broker.md
      - "ADR-0003: Outbox, idempotent receiver, reconciliation": adr/0003-outbox-idempotent-receiver-reconciliation.md
      - "ADR-0004: LLM as a constrained classifier and drafter": adr/0004-llm-constrained-workflow.md
      - "ADR-0005: Idempotency key definition": adr/0005-idempotency-key-definition.md
      - "ADR-0006: Python ≥ 3.13, uv, ruff (79 cols), mypy strict": adr/0006-python-and-tooling.md
      - "ADR-0007: 100 % branch coverage plus mutation testing": adr/0007-coverage-and-test-depth.md
      - "ADR-0008: `request_eta` is a first-class decision value": adr/0008-request-eta-decision.md
      - "ADR-0009: OWASP ASVS 5.0 Level 2 as the security baseline": adr/0009-asvs-l2-security-baseline.md
      - "ADR-0010: Prometheus + Grafana + Loki + Alloy, provisioned as code": adr/0010-observability-stack.md
      - "ADR-0011: Toolchain and quality gates (Ruff ALL + Bandit + Semgrep)": adr/0011-toolchain-and-quality-gates.md
      - "ADR-0012: LLM evaluation harness with recorded responses": adr/0012-llm-evaluation-harness.md
      - "ADR-0013: OpenAI model router (Responses API, Sol generation)": adr/0013-openai-model-router.md
      - "ADR-0014: Owned language calls and budget bounds": adr/0014-owned-language-and-budget-bounds.md
      - "ADR-0015: Bounded writes and durable admission": adr/0015-bounded-writes-and-durable-admission.md
      - "ADR-0016: Bounded LLM orchestrator": adr/0016-bounded-llm-orchestrator.md
      - "ADR-0017: LLM output and notification boundaries": adr/0017-llm-output-and-notification-boundaries.md
      - "ADR-0018: Message intents, review and shared budget": adr/0018-message-intents-review-and-shared-budget.md
