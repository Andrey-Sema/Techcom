[project]
name = "techcom-mocks"
version = "0.1.0"
description = "Local-only task and idempotent delivery test receiver."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "pydantic>=2.10",
    "starlette>=0.40",
    "uvicorn>=0.32",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/techcom_mocks"]
