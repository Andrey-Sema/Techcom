extends: default
ignore: |
  .venv/
  uv.lock
  var/
  mutants/
rules:
  document-start: disable
  line-length:
    max: 120
    level: warning
  truthy:
    # GitHub Actions uses the bare key "on".
    allowed-values: ["true", "false", "on"]
    check-keys: false
  comments:
    min-spaces-from-content: 1
