name: techcom
services:
  db:
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    # Pinned by digest like every other image; Dependabot proposes updates.
    image: postgres:18@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    environment:
      POSTGRES_DB: followup
      POSTGRES_USER: followup
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U followup -d followup"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt: ["no-new-privileges:true"]

volumes:
  pgdata:

secrets:
  postgres_password:
    file: ./secrets/postgres_password
