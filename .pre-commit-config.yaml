minimum_pre_commit_version: "4.0.0"
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: debug-statements
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace
  - repo: local
    hooks:
      - id: lock-check
        name: lock consistency
        entry: uv lock --check
        language: system
        pass_filenames: false
      - id: ruff
        name: Ruff ALL
        entry: uv run --locked ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format
        entry: uv run --locked ruff format --check
        language: system
        types: [python]
      - id: quality
        name: types, security and architecture
        entry: make quality
        language: system
        pass_filenames: false
      - id: no-coverage-suppression
        name: no coverage suppression
        entry: 'pragma:\s*no\s*(cover|branch)'
        language: pygrep
        types: [python]
      - id: no-blanket-ignore
        name: type ignores must specify an error code
        entry: '#\s*type:\s*ignore(?!\[)'
        language: pygrep
        types: [python]
      - id: no-bare-nosec
        name: nosec must specify a Bandit check
        entry: '#\s*nosec(?!\s+B\d{3})'
        language: pygrep
        types: [python]
