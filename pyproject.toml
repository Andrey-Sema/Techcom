[project]
name = "techcom-followup"
version = "0.1.0"
description = "AI operations & follow-up service with safe, idempotent actions."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # Lower bounds only; exact versions are frozen in uv.lock.
    "openai>=3.36,<4",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
]

[dependency-groups]
dev = [
    "bandit[toml]>=1.8",
    "hypothesis>=6.120",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-randomly>=3.16",
    "ruff>=0.8",
    "syrupy>=4.8",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/techcom_followup"]

[tool.uv]
default-groups = ["dev"]

# ---------------------------------------------------------------- ruff --
[tool.ruff]
line-length = 79                       # strict PEP 8
target-version = "py313"               # keep in sync with mypy
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", "ISC001",   # conflict with ruff format
    "D203", "D213",       # pick D211 / D212 (Google style)
    "TRY003",             # EM rules already force message variables
    "FIX002",             # TODOs allowed only with an issue link (TD003)
    "CPY001",             # licence is declared once in LICENSE
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "PLR2004", "ANN", "ARG", "FBT", "INP001", "SLF001"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 72

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 6
max-branches = 10
max-returns = 4
max-statements = 40

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["techcom_followup"]

[tool.ruff.format]
docstring-code-format = true

# --------------------------------------------------------------- bandit --
[tool.bandit]
exclude_dirs = ["tests", ".venv"]
# No global skips. A suppression must be inline "# nosec BXXX" plus a
# justification comment.

# ---------------------------------------------------------------- mypy --
[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
enable_error_code = [
    "ignore-without-code", "redundant-expr", "truthy-bool",
    "possibly-undefined", "explicit-override",
]
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# -------------------------------------------------------------- pytest --
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra", "--strict-markers", "--strict-config",
    "--cov", "--cov-branch", "--cov-report=term-missing",
    "-m", "not live_llm",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
xfail_strict = true
filterwarnings = ["error"]
markers = [
    "live_llm: calls the real LLM provider (opt-in, needs a key)",
]

# ------------------------------------------------------------ coverage --
[tool.coverage.run]
branch = true
source = ["techcom_followup"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "raise NotImplementedError",
    "@overload",
]
