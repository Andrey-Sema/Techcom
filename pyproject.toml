[project]
name = "techcom-followup"
version = "0.1.0"
description = "AI operations & follow-up service with safe, idempotent actions."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # Lower bounds only; exact versions are frozen in uv.lock.
    "openai>=3.36,<4",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "alembic>=1.14",
    "psycopg[binary,pool]>=3.2",
    "sqlalchemy[asyncio]>=2.0,<2.1",
]

[dependency-groups]
dev = [
    "bandit[toml]>=1.8",
    "hypothesis>=6.120",
    "httpx>=0.28",
    "import-linter>=2.1",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-randomly>=3.16",
    "ruff>=0.8",
    "pre-commit>=4.0",
    "syrupy>=4.8",
    "techcom-mocks",
    "testcontainers[postgres]>=4.8",
    "types-docker>=7.1",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.7.7",
]
gates = [
    "check-jsonschema>=0.38.2",
    "codespell>=2.4.3",
    "commitizen>=4.19.2",
    "deptry>=0.25.1",
    "pip-audit>=2.10.1",
    "validate-pyproject[all]>=0.26",
    "vulture>=2.16",
    "xenon>=0.9.3",
    "yamllint>=1.38.0",
    "zizmor>=1.31.1",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/techcom_followup"]

[tool.uv]
default-groups = ["dev"]

[tool.uv.workspace]
members = ["mocks"]

[tool.uv.sources]
techcom-mocks = { workspace = true }

# ---------------------------------------------------------------- ruff --
[tool.ruff]
line-length = 79                       # strict PEP 8
target-version = "py313"               # keep in sync with mypy
src = ["src", "mocks/src", "tests"]
# Semgrep rule fixtures are deliberately insecure code.
extend-exclude = [".semgrep"]
# Apply the exclusion to files that pre-commit passes explicitly, too.
force-exclude = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", "ISC001",   # conflict with ruff format
    "D203", "D213",       # pick D211 / D212 (Google style)
    "TRY003",             # EM rules already force message variables
    "FIX002",             # TODOs allowed only with an issue link (TD003)
    "CPY001",             # licence is declared once in LICENSE
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "PLR2004", "ANN", "ARG", "FBT", "INP001", "SLF001"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 72

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 6
max-branches = 10
max-returns = 4
max-statements = 40

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["techcom_followup", "techcom_mocks"]

[tool.ruff.format]
docstring-code-format = true

# --------------------------------------------------------------- bandit --
[tool.bandit]
exclude_dirs = ["tests", ".venv"]
# No global skips. A suppression must be inline "# nosec BXXX" plus a
# justification comment.

# ---------------------------------------------------------------- mypy --
[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
enable_error_code = [
    "ignore-without-code", "redundant-expr", "truthy-bool",
    "possibly-undefined", "explicit-override",
]
plugins = ["pydantic.mypy"]
files = ["src", "mocks/src", "tests", "migrations"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# -------------------------------------------------------------- pytest --
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra", "--strict-markers", "--strict-config",
    "--cov", "--cov-branch", "--cov-report=term-missing",
    "-m", "not live_llm",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
xfail_strict = true
filterwarnings = ["error"]
markers = [
    "live_llm: calls the real LLM provider (opt-in, needs a key)",
    "integration: requires PostgreSQL 18 in Docker",
    "asvs: evidence for an implemented ASVS security control",
]

# ------------------------------------------------------------ coverage --
[tool.coverage.run]
branch = true
source = ["techcom_followup", "techcom_mocks"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "raise NotImplementedError",
    "@overload",
]

[tool.importlinter]
root_packages = ["techcom_followup", "techcom_mocks"]

[[tool.importlinter.contracts]]
name = "Hexagonal layers"
type = "layers"
layers = [
    "techcom_followup.adapters",
    "techcom_followup.infrastructure",
    "techcom_followup.application",
    "techcom_followup.domain",
]

[[tool.importlinter.contracts]]
name = "Mock isolation"
type = "independence"
modules = ["techcom_followup", "techcom_mocks"]

# ------------------------------------------------------------ gates --
[tool.vulture]
paths = ["src", "mocks/src"]
min_confidence = 80
sort_by_size = true

[tool.deptry]
known_first_party = ["techcom_followup", "techcom_mocks"]
# The mock distribution declares its own dependencies in
# mocks/pyproject.toml; deptry checks it in a separate run.
extend_exclude = ["mocks", "migrations", "scripts", "docs", ".semgrep"]

[tool.deptry.per_rule_ignores]
# alembic runs the migrations/ scripts; psycopg is the SQLAlchemy
# driver selected by the "postgresql+psycopg" URL. Neither is imported.
DEP002 = ["alembic", "psycopg"]

[tool.codespell]
skip = """*.lock,./fixtures/*,./.git/*,./.venv/*,./.*_cache/*,./var/*,\
./.hypothesis/*,*.svg,./tests/golden/__snapshots__/*"""
check-hidden = true
# "nd" (2nd), "cancell" (regex stem), "caf" (test data), "ot" (OTLP).
ignore-words-list = "nd,cancell,caf,ot"

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "uv"
tag_format = "v$version"
update_changelog_on_bump = true
major_version_zero = true
